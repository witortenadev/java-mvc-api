<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8">
    <title>Categoria</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 40px;
        background: #f5f5f5;
      }
      .container {
        max-width: 600px;
        margin: 0 auto;
        background: #fff;
        padding: 24px;
        border: 1px solid #ddd;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      td {
        padding: 10px 8px;
        border-bottom: 1px solid #eee;
      }
      td:first-child {
        width: 180px;
        font-weight: bold;
      }
      a {
        display: inline-block;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Categoria</h1>
      <table>
        <tr>
          <td>Gênero</td>
          <td th:text="${categoria.genero}">Gênero</td>
        </tr>
      </table>
      <a th:href="@{/categorias}">Voltar</a>
    </div>
  </body>
</html>
